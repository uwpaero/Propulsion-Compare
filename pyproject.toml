[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "propselect"
version = "0.1.0"
description = "Electric motor + propeller selection tool for fixed-wing takeoff performance"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "PySide6>=6.6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["propselect*"]

[tool.pytest.ini_options]
testpaths = ["propselect/tests"]
